<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAL Refresher Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#112D4E;--red:#9A2126;--bg:#F3F5F8;--surface:#FFFFFF;--ink:#16202C;--muted:#5A6270;--line:#D5DAE2;--soft:#E8EDF4;--ok:#1E7A4C;--okbg:#E4F3EA;--bad:#9A2126;--badbg:#F8E6E7;--accent:var(--navy);--onaccent:#FFFFFF;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1828;--surface:#13233A;--ink:#E9EEF5;--muted:#A3AEBE;--line:#2A3D57;--soft:#1B2F4B;--ok:#6CCB97;--okbg:#173A2A;--bad:#F08A8F;--badbg:#3D1B20;--accent:#8FB4E6;--onaccent:#0C1828;--red:#E46B72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1828;--surface:#13233A;--ink:#E9EEF5;--muted:#A3AEBE;--line:#2A3D57;--soft:#1B2F4B;--ok:#6CCB97;--okbg:#173A2A;--bad:#F08A8F;--badbg:#3D1B20;--accent:#8FB4E6;--onaccent:#0C1828;--red:#E46B72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.wide{max-width:1040px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.brand{font-weight:800;color:var(--accent);letter-spacing:-.01em}
.brand span{color:var(--red)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px;font-weight:800;color:var(--accent)}
h2{font-size:24px;margin:0 0 8px;letter-spacing:-.01em}
p.lede{color:var(--muted);font-size:19px;margin:0 0 28px;max-width:56ch}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin:0 0 30px;border-radius:12px;overflow:hidden}
.sections div{background:var(--surface);padding:14px 16px;font-size:15px}
.sections b{display:block;font-size:26px;color:var(--red);line-height:1.1}
label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
input,select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.field{margin-bottom:16px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 22px;background:var(--accent);color:var(--onaccent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.note{font-size:14px;color:var(--muted);margin-top:14px}
/* progress */
.prog{display:flex;gap:3px;margin-bottom:26px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:var(--red)}
.prog i.gap{margin-left:7px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:10px}
.qtext{font-size:clamp(22px,3.6vw,28px);font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0 0 22px}
.opts{display:grid;gap:10px;margin-bottom:26px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--accent)}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--onaccent)}
.nav{display:flex;justify-content:space-between;gap:12px}
/* results */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.score .big{font-size:clamp(64px,14vw,104px);font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent)}
.score .of{font-size:24px;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.pill.pass{background:var(--okbg);color:var(--ok)}.pill.fail{background:var(--badbg);color:var(--bad)}
.status{font-size:15px;color:var(--muted);margin:10px 0 28px}
.review{display:grid;gap:12px;margin:18px 0 28px}
.rv{background:var(--surface);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:14px 16px}
.rv.right{border-left-color:var(--ok)}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .a{font-size:15px}
.rv .a s{color:var(--muted)}
.rv .x{font-size:15px;color:var(--muted);margin-top:4px}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
.stats div{background:var(--surface);border-radius:12px;padding:16px}
.stats b{display:block;font-size:32px;font-weight:800;color:var(--accent);line-height:1.1}
.stats span{font-size:14px;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.tools .field{margin:0;min-width:180px;flex:1}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:12px;margin-bottom:30px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.miss{display:grid;gap:8px;margin-bottom:30px}
.miss div{display:grid;grid-template-columns:44px 1fr 120px;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 14px;font-size:15px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.empty{background:var(--surface);border-radius:12px;padding:28px;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:520px){.wrap{padding:20px 16px 48px}.miss div{grid-template-columns:36px 1fr}.miss .bar{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.qcard{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap" id="app">
 <header class="top">
  <div class="brand">TAL <span>refresher</span> quiz</div>
  
 </header>
 <main id="view"></main>
</div>
<script>
const RAW=[["Welcome to TAL", "Who is TAL’s Chief Executive Officer?", ["Derek Watson", "Nigel Barnett", "Fred Danneau", "Sasha Barnett"], 1, "Nigel Barnett is CEO, with over 30 years in the telecoms industry."], ["Welcome to TAL", "What happened to TAL in 2026?", ["It was acquired by Global 4", "It was bought back by CEO Nigel Barnett and is now fully independent", "It merged with Virgin Media", "It became partially owned by BT"], 1, "In 2026 TAL was bought back by Nigel Barnett, making it fully independent."], ["Welcome to TAL", "Which of these is NOT one of TAL’s four core values?", ["You Move, We Move", "Connection is Key", "Striving for More", "Customer First, Always"], 3, "The four values are You Move, We Move; Connection is Key; Striving for More; and Work Hard, Play Hard."], ["Welcome to TAL", "Who is TAL’s 2026 charity partner?", ["Macmillan Cancer Support", "British Heart Foundation", "Great Ormond Street Hospital", "Cancer Research UK"], 2, "TAL is proud to support Great Ormond Street Hospital in 2026."], ["Welcome to TAL", "What are TAL’s standard office working hours?", ["9:00am to 5:00pm", "8:00am to 4:30pm", "9:00am to 6:00pm", "8:30am to 5:30pm"], 3, "Working hours are 8:30am to 5:30pm."], ["Welcome to TAL", "If you are unwell or running late, what should you do?", ["Email your line manager by 10:00am", "Call 01403 214040 before 8:30am", "Message a colleague on Teams when you can", "Log it on Breathe HR the following day"], 1, "Call the sickness line on 01403 214040 before 8:30am and contact your line manager."], ["Welcome to TAL", "How much annual holiday do TAL employees receive?", ["20 days plus birthday leave", "25 days plus birthday leave", "28 days with no birthday leave", "22 days plus birthday leave"], 1, "Staff get 25 days’ holiday plus birthday leave, and can buy or sell up to 5 days."], ["Welcome to TAL", "Where do you book annual leave and read company policies?", ["Breathe HR", "iHASCO", "The LinkedIn company page", "Microsoft Teams"], 0, "Annual leave is booked on Breathe HR, and all policies are held there."], ["Compliance and data security", "Which two ISO accreditations does TAL hold?", ["ISO 14001 and ISO 45001", "ISO 9001 and ISO 27001", "ISO 9001 and ISO 14001", "ISO 27001 and ISO 22301"], 1, "TAL holds ISO 9001 (quality) and ISO 27001 (information security)."], ["Compliance and data security", "What does ISO 27001 cover?", ["Information Security Management System", "Quality Management System", "Environmental Management System", "Health and Safety Management System"], 0, "ISO 27001 is the Information Security Management System; ISO 9001 is the Quality Management System."], ["Compliance and data security", "You suspect a data breach. What should you do?", ["Forward it to your team so they can check it too", "Wait until the end of the day to see if it resolves itself", "Delete it quietly and carry on", "Act fast: report it to IT security and do not forward it to anyone else"], 3, "Act fast. Email itsecurity@global4.co.uk or contact Compliance, and do not forward it to anyone but IT."], ["Compliance and data security", "Which keyboard shortcut quickly locks your screen?", ["Ctrl + Shift + Esc", "Alt + F4", "Windows key + L", "Windows key + D"], 2, "Lock your screen with Windows key + L (or Ctrl + Alt + Del, then Lock)."], ["Compliance and data security", "You send a password-protected attachment. How should you share the password?", ["In the body of the same email", "In the email subject line", "Through a different channel, such as a phone call or Teams", "Attached as a text file in the same email"], 2, "Always give the password through an alternative channel, never alongside the attachment."], ["The customer life cycle", "When does the Sales team call new leads?", ["On the day of move-in", "30 days after move-in", "7 to 14 days before move-in", "1 to 2 days before move-in"], 2, "7 to 14 days before move-in is the sweet spot, with around 76% conversion on first calls."], ["The customer life cycle", "Which three teams make up Stage 1 (Onboarding) of the customer life cycle?", ["Sales, Billing and Marketing", "Customer Care, Technical Support and Orders", "Sales, Credit Control and Finance", "Sales, Orders and Customer Promotions"], 3, "Onboarding covers Sales, Orders and Customer Promotions."], ["The customer life cycle", "1st Line can’t fix a customer’s complex fault. Where is it escalated?", ["2nd Line Technical Support", "Customer Care", "Projects", "TAL IT Support"], 0, "1st Line triages common problems; complex faults go to 2nd Line. TAL IT Support is for internal systems only."], ["The customer life cycle", "A customer has an overdue account and needs a payment plan. Which team handles this?", ["Billing", "Customer Care", "Finance", "Credit Control"], 3, "Credit Control manages overdue accounts, payment plans and financial risk."], ["The customer life cycle", "Which team generates leads for Sales?", ["Data Analytics", "Customer Promotions", "Marketing", "Orders"], 2, "Marketing generates leads for Sales and supports customer communications."], ["The customer life cycle", "Which team focuses on customers at risk of leaving, contract renewals and win-back offers?", ["Loyalty, Retentions and Promotions", "Customer Care", "Quality", "Billing"], 0, "Loyalty, Retentions and Promotions engage at-risk customers and manage renewals and win-backs."], ["The customer life cycle", "Which team oversees the business change management framework and larger-scale implementations?", ["Development", "Projects", "Compliance", "Data Analytics"], 1, "Projects, led by Peter Ryan, oversees change management and larger implementations."], ["Home Telecom products and services", "What makes Home Telecom stand out for tenants?", ["We offer free installation on every package", "We guarantee the cheapest price in the UK", "We’re the only provider that can match a 6-month tenancy agreement and break clause", "We upgrade every customer’s router each year"], 2, "Home Telecom is the only provider that can match a 6-month tenancy and break clause."], ["Home Telecom products and services", "Roughly how much of the UK can Home Telecom cover?", ["75%", "85%", "100%", "98%"], 3, "Through all its accesses, Home Telecom covers 98% of the UK."], ["Home Telecom products and services", "Which statement about Home Telecom broadband is true?", ["A fair use policy applies at peak times", "Traffic is managed in the evenings", "Cheaper packages have data caps", "There is no fair use policy and no traffic management"], 3, "No fair use policy, no traffic management, and no hidden costs, caps or restrictions."], ["Home Telecom products and services", "A customer moves to a property Home Telecom can’t supply. What happens?", ["They must pay the rest of their contract", "They can cancel for free", "They pay a reduced exit fee", "They must transfer the contract to the new tenant"], 1, "If we can’t supply the new property, the customer can cancel for free."], ["Home Telecom products and services", "What contract length can Home Telecom offer on Virgin access?", ["18 months, where Virgin direct starts at 24 months", "24 months, where Virgin direct starts at 12 months", "12 months, where Virgin direct starts at 18 months", "6 months, the same as Virgin direct"], 2, "Home Telecom can offer a Virgin line on a 12-month contract; Virgin directly starts at 18 months."], ["Home Telecom products and services", "With VoIP, when can a customer’s existing number be ported over?", ["On the same day as the installation", "10 working days after the fibre installation", "30 days before the installation", "5 working days after the order is placed"], 1, "Porting can happen 10 working days after installation. A temporary number is available 30 minutes after the internet goes live."], ["Home Telecom products and services", "What does Priority Booking cost, and what does the customer get?", ["£20 for the very next available installation date", "£30 for a guaranteed next-day installation", "£20 for a weekend appointment", "£10 for a morning time slot"], 0, "For £20, the customer gets the very next available date in their area."], ["Home Telecom products and services", "Which describes the Home Hub Plus?", ["A one-off £30 payment, theirs to keep, with a 12-month warranty", "£5 a month rental, returned at the end of the contract", "Free, but it must be returned when they leave", "A one-off £60 payment with a 24-month warranty"], 0, "The Wi-Fi 6 Home Hub Plus is a one-off £30, the customer keeps it, and it has a 12-month warranty."], ["Home Telecom products and services", "Which describes SupportPlus?", ["£3 a month for 24/7 UK support, taken for at least 12 months", "£5 a month for support during business hours only", "£3 a month, cancellable at any time", "Free for the first year, then £5 a month"], 0, "SupportPlus (formerly Enhanced Care) is £3 a month for a free-to-call 24/7 UK line, with a 12-month minimum."], ["Home Telecom products and services", "Lead supplier Vouch is owned by which company?", ["The Lettings Hub", "Canopy", "Goodlord", "Muuvo"], 2, "Vouch is a referencing platform owned by Goodlord."]]
;
const Q=RAW.map((r,i)=>({n:i+1,section:r[0],q:r[1],options:r[2],answer:r[3],explain:r[4]}));
const L="ABCD",PASS=24;
const TEAMS=["Sales","Orders","Customer Promotions","Customer Care","Technical Support","Loyalty, Retentions & Promotions","Billing","Credit Control","Marketing","Finance","Compliance","Quality","Development","Projects","People & Culture","TAL IT Support","Data Analytics","Other"];
const SECTIONS=[...new Set(Q.map(q=>q.section))];
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?"":v)}for(const c of k.flat()){if(c==null)continue;e.append(c instanceof Node?c:document.createTextNode(c))}return e};
const ENDPOINT="PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
const st={name:"",team:"",i:0,ans:Array(Q.length).fill(null),phase:"start",saved:null,last:null};
function view(...n){const v=$("#view");v.replaceChildren(...n.flat(2).filter(x=>x!=null));window.scrollTo(0,0)}

function start(){
 const counts=SECTIONS.map(s=>el("div",{},el("b",{},String(Q.filter(q=>q.section===s).length)),s));
 const name=el("input",{id:"nm",autocomplete:"name",value:st.name,placeholder:"First and last name"});
 const team=el("select",{id:"tm"},el("option",{value:""},"Choose your team"),TEAMS.map(t=>el("option",{value:t,selected:t===st.team},t)));
 const go=el("button",{class:"btn",onclick:()=>{st.name=name.value.trim();st.team=team.value;st.phase="q";st.i=0;st.ans=Array(Q.length).fill(null);question()}},"Start the quiz");
 const check=()=>go.disabled=!(name.value.trim()&&team.value);name.addEventListener("input",check);team.addEventListener("change",check);check();
 view(el("h1",{},"How well do you know TAL?"),
  el("p",{class:"lede"},"30 multiple-choice questions on what you covered in onboarding. It takes about 10 minutes. You need 24 or more to pass."),
  el("div",{class:"sections"},counts),
  el("div",{class:"field"},el("label",{for:"nm"},"Your name"),name),
  el("div",{class:"field"},el("label",{for:"tm"},"Your team"),team),
  go,
  el("p",{class:"note",id:"savenote"},saveNote()));
}
function saveNote(){return "Your score and answers are sent to L&D automatically when you finish."}

function question(){
 const q=Q[st.i];
 const prog=el("div",{class:"prog","aria-hidden":"true"},Q.map((x,j)=>el("i",{class:[st.ans[j]!=null?"done":"",j===st.i?"cur":"",j>0&&Q[j-1].section!==x.section?"gap":""].join(" ")})));
 const opts=el("div",{class:"opts",role:"radiogroup","aria-label":"Answers"},q.options.map((o,k)=>el("button",{class:"opt",role:"radio","aria-checked":String(st.ans[st.i]===k),onclick:()=>{st.ans[st.i]=k;question();setTimeout(()=>$(".opt[aria-checked='true']")?.focus(),0)}},el("span",{class:"k"},L[k]),el("span",{},o))));
 const last=st.i===Q.length-1;
 const next=el("button",{class:"btn",disabled:st.ans[st.i]==null,onclick:()=>{if(last)finish();else{st.i++;question()}}},last?"Finish and see my score":"Next question");
 const back=el("button",{class:"btn ghost",disabled:st.i===0,onclick:()=>{st.i--;question()}},"Back");
 view(prog,el("div",{class:"qcard"},el("div",{class:"meta"},el("span",{},q.section),el("span",{},`${st.i+1} of ${Q.length}`)),el("p",{class:"qtext"},q.q),opts,el("div",{class:"nav"},back,next)));
}

async function finish(){
 const score=st.ans.reduce((a,v,i)=>a+(v===Q[i].answer?1:0),0);
 st.last={score,passed:score>=PASS,at:new Date().toISOString()};
 st.phase="done";st.saved="saving";results_();
 if(st.saved==="saving"){
  try{
   await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:st.name,team:st.team,answers:st.ans,score,total:Q.length,submittedAt:st.last.at})});
   st.saved="ok";
  }catch(e){st.saved="err"}
  const s=$("#savestatus");if(s)s.textContent=statusText();
 }
}
function statusText(){return{saving:"Sending your result to L&D…",ok:"Your result has been sent to L&D.",err:"Your result couldn’t be sent. Please tell your line manager your score.",off:"Please tell your line manager your score."}[st.saved]}
function results_(){
 const {score,passed}=st.last;
 const wrong=Q.filter((q,i)=>st.ans[i]!==q.answer);
 const rv=q=>el("div",{class:"rv"+(st.ans[q.n-1]===q.answer?" right":"")},el("div",{class:"q"},`${q.n}. ${q.q}`),
   el("div",{class:"a"},st.ans[q.n-1]===q.answer?null:[el("s",{},`You said ${L[st.ans[q.n-1]]}: ${q.options[st.ans[q.n-1]]}`),el("br")],el("b",{},`Answer ${L[q.answer]}: ${q.options[q.answer]}`)),
   el("div",{class:"x"},q.explain));
 view(el("h2",{},st.name?`Well done for finishing, ${st.name.split(" ")[0]}.`:"Quiz complete"),
  el("div",{class:"score"},el("span",{class:"big"},String(score)),el("span",{class:"of"},`out of ${Q.length}`),el("span",{class:"pill "+(passed?"pass":"fail")},passed?"Passed":"Not passed yet")),
  el("p",{class:"status",id:"savestatus"},statusText()),
  wrong.length?[el("h2",{},`${wrong.length} to review`),el("div",{class:"review"},wrong.map(rv))]:el("p",{},"Every answer correct. Brilliant."),
  el("button",{class:"btn ghost",onclick:()=>{st.phase="start";start()}},"Take the quiz again"));
}

start();
</script>
</body>
</html>
